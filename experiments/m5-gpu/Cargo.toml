[package]
name = "packtok-m5"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

# Separate dependency/build graph: root historical workspace stays Rust 1.85/CUDA-free.
[workspace]
resolver = "3"

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda"]

[dependencies]
candle-core = "=0.9.1"
candle-nn = "=0.9.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
safetensors = "=0.4.5"
packtok-core = { path = "../../crates/packtok-core" }
packtok-format = { path = "../../crates/packtok-format" }
packtok-tokenizer = { path = "../../crates/packtok-tokenizer" }
packtok-train = { path = "../../crates/packtok-train" }
packtok-model = { path = "../../crates/packtok-model" }

[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
all = "warn"
