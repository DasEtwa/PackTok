[workspace]
members = [
    "crates/packtok-core",
    "crates/packtok-packs",
    "crates/packtok-format",
    "crates/packtok-tokenizer",
    "crates/packtok-train",
    "crates/packtok-cli",
    "crates/packtok-bench",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
